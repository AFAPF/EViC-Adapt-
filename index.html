<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>EViC-Adapt – Bilan numérique complet</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f4f7fc; --surface: #ffffff; --text: #1e293b;
      --primary: #3b82f6; --primary-hover: #2563eb;
      --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
      --border: #e2e8f0; --radius: 12px;
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
      --font-size: 16px; --font-family: 'Inter', system-ui, sans-serif;
    }
    body.dark {
      --bg: #0f172a; --surface: #1e293b; --text: #e2e8f0;
      --primary: #60a5fa; --primary-hover: #3b82f6;
      --success: #34d399; --warning: #fbbf24; --danger: #f87171;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family); font-size: var(--font-size);
      background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    .app-shell { max-width: 960px; margin: 0 auto; padding: 1rem; }
    .top-nav {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
      background: var(--surface); padding: 0.75rem 1rem; border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .logo { font-weight: 700; font-size: 1.25rem; color: var(--primary); margin-right: auto; }
    .btn {
      background: var(--primary); color: white; border: none; padding: 0.5rem 1rem; border-radius: 8px;
      cursor: pointer; font-weight: 500; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.3rem;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .btn.secondary { background: #64748b; }
    .btn.success { background: var(--success); }
    .btn.warning { background: var(--warning); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .card {
      background: var(--surface); border-radius: var(--radius); padding: 2rem; margin-bottom: 1rem;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.75rem; }
    input, select, textarea {
      padding: 0.6rem; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text); font-size: 0.95rem; font-family: var(--font-family);
    }
    .game-area {
      position: relative; width: 100%; height: 400px; background: #f8fafc;
      border: 2px solid var(--border); border-radius: var(--radius); overflow: hidden; margin: 1rem 0;
    }
    .target {
      position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ff6b6b, #c92a2a);
      box-shadow: 0 0 12px rgba(255,0,0,0.5); transition: transform 0.1s;
    }
    .target.clicked { background: radial-gradient(circle at 30% 30%, #69db7c, #2b8a3e); }
    .timer { font-size: 1.4rem; font-weight: 600; margin: 0.5rem 0; background: var(--bg); padding: 0.3rem 0.8rem; border-radius: 6px; display: inline-block; }
    .grid-cell {
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; border-radius: 8px; background: var(--surface); border: 1px solid var(--border);
      user-select: none; transition: background 0.2s;
    }
    .grid-cell.selected { background: #d3f9d8; border-color: var(--success); box-shadow: 0 0 0 2px var(--success); }
    .dropzone {
      border: 2px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: #94a3b8; font-size: 0.9rem; background: rgba(0,0,0,0.02); min-width: 80px; min-height: 80px;
    }
    .construction-zone {
      position: relative; width: 100%; height: 350px; background: #f9fafb;
      border: 2px dashed var(--border); border-radius: var(--radius); overflow: hidden; touch-action: none;
    }
    .palette-item {
      width: 50px; height: 50px; border-radius: 8px; cursor: grab; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); transition: transform 0.2s;
    }
    .shape-on-zone { position: absolute; cursor: move; border: 1px solid rgba(0,0,0,0.2); touch-action: none; }
    .stat-container { position: relative; height: 300px; margin: 1rem 0; }
    canvas { touch-action: none; display: block; }
    .score-badge {
      display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: bold;
      background: var(--primary); color: white; font-size: 0.8rem;
    }
    .category-card {
      background: var(--surface); border-radius: var(--radius); padding: 1rem; margin: 0.5rem;
      border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .emoji-btn { font-size: 2rem; background: none; border: 2px solid transparent; border-radius: 8px; padding: 0.3rem 0.6rem; cursor: pointer; }
    .emoji-btn:hover, .emoji-btn.selected { border-color: var(--primary); background: var(--bg); }
    .mem-item {
      cursor: pointer; padding: 0.5rem; border: 2px solid transparent; border-radius: 8px; user-select: none;
    }
    .mem-item.selected { border-color: var(--primary); background: var(--primary-light); }
    .norm-bar { height: 10px; background: #e0e0e0; border-radius: 4px; margin: 0.3rem 0; position: relative; }
    .norm-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .norm-indicator { position: absolute; top: -5px; width: 4px; height: 20px; background: black; border-radius: 2px; }

    .toolbar-actions { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin:0.75rem 0; }
    .report-header {
      display:grid; grid-template-columns: 1fr 1fr; gap:0.75rem;
      background: var(--bg); border:1px solid var(--border); border-radius:10px; padding:1rem; margin:1rem 0;
    }
    .report-table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:0.92rem; }
    .report-table th, .report-table td { border:1px solid var(--border); padding:0.5rem; text-align:left; vertical-align:top; }
    .report-table th { background:var(--bg); }
    .report-section { break-inside: avoid; page-break-inside: avoid; margin-bottom:1rem; }
    .conclusion-box { border-left:4px solid var(--primary); background:var(--bg); padding:1rem; border-radius:8px; margin:1rem 0; }

    .observer-section { border:1px solid var(--border); border-radius:10px; padding:1rem; margin:1rem 0; background:var(--surface); }
    .observer-section h3 { margin-bottom:0.75rem; color:var(--primary); }
    .check-list { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:0.5rem; margin:0.6rem 0 0.9rem; }
    .check-option { display:flex; align-items:flex-start; gap:0.45rem; padding:0.45rem 0.55rem; border:1px solid var(--border); border-radius:8px; background:var(--bg); cursor:pointer; }
    .check-option input { margin-top:0.25rem; }
    .observer-note { font-size:0.9rem; opacity:0.85; margin:0.4rem 0 1rem; }
    .print-only { display:none; }
    @media print {
      body { background:#fff !important; color:#111 !important; font-size:12px !important; }
      .app-shell { max-width:none; padding:0; }
      .top-nav, .no-print, .screen-only { display:none !important; }
      .print-only { display:block !important; }
      .card { box-shadow:none !important; border:none !important; padding:0 !important; margin:0 !important; }
      .report-table th, .report-table td { border:1px solid #999 !important; }
      .category-card { box-shadow:none !important; border:1px solid #999 !important; }
      .stat-container { height:240px !important; page-break-inside:avoid; }
      h1, h2, h3 { color:#111 !important; }
    }

  </style>
</head>
<body class="light">
  <div class="app-shell" id="app"></div>
  <script>
    // ========== APP CORE ==========
    const App = {
      currentUser: null,
      settings: { theme:'light', fontSize:'normal', fontFamily:'Inter', soundEnabled:true },
      audioCtx: null,
      getUsers() { return JSON.parse(localStorage.getItem('ergoeval_users')||'[]'); },
      saveUsers(u) { localStorage.setItem('ergoeval_users', JSON.stringify(u)); },
      getSessions(uid) { return JSON.parse(localStorage.getItem('ergoeval_sessions')||'[]').filter(s=>s.userId==uid); },
      saveSession(s) {
        const all = JSON.parse(localStorage.getItem('ergoeval_sessions')||'[]');
        s.id = Date.now().toString(); all.push(s);
        localStorage.setItem('ergoeval_sessions', JSON.stringify(all));
      },
      applySettings() {
        document.body.className = this.settings.theme;
        document.documentElement.style.setProperty('--font-family', this.settings.fontFamily);
        const sizes = { normal:'16px', large:'20px', xlarge:'24px' };
        document.documentElement.style.setProperty('--font-size', sizes[this.settings.fontSize]||'16px');
      },
      loadSettings() {
        Object.assign(this.settings, JSON.parse(localStorage.getItem('ergoeval_settings')||'{}'));
        this.applySettings();
      },
      saveSettings() {
        localStorage.setItem('ergoeval_settings', JSON.stringify(this.settings));
        this.applySettings();
      },
      beep(freq, dur) {
        if(!this.settings.soundEnabled) return;
        try {
          if(!this.audioCtx) this.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
          const o = this.audioCtx.createOscillator(), g = this.audioCtx.createGain();
          o.type='sine'; o.frequency.value=freq; g.gain.value=0.08;
          o.connect(g); g.connect(this.audioCtx.destination);
          o.start(); setTimeout(()=>o.stop(), dur);
        } catch(e){}
      },
      render(html) { document.getElementById('app').innerHTML = html; this.applySettings(); }
    };

    // ========== TEXTES ÉTALONNÉS ==========
    const TEXTES_NIVEAUX = {
      CE1: "Le chat de la sorcière fait la tête. Il ne veut plus goûter les recettes de sa patronne. La dernière fois, il a été transformé en souris.",
      CE2: "Voici deux heures que nous sommes dans le train. Le paysage défile sous nos yeux. Pour mieux voir, je descends la vitre du compartiment. Mais la porte en face est ouverte et, horreur, voilà que le chapeau de la vieille dame s’envole dans le couloir.",
      CM1: "Il était une fois un joueur de flûte magicien… Tout le monde connaît cette vieille histoire. Elle parle d’une cité envahie par les rats et d’un jeune homme qui, avec sa flûte magique, entraîna les rats vers la rivière pour les noyer. Mais le maire ne voulut pas le récompenser. Le jeune homme recommença alors à jouer de la flûte et emmena avec lui tous les enfants.",
      CM2: "La première fée choisit une belle pierre ronde et la transforma en un puissant cheval blanc. La deuxième fée écarta quelques fleurs, toucha la terre et en fit jaillir une source aux eaux transparentes. La troisième fée, toute impatiente, planta sa baguette dans le sol. Aussitôt, un magnifique chêne se mit à pousser. Les branches n’arrêtaient pas de grandir, repoussant plus belles et plus fortes chaque fois qu’on les coupait.",
      "6ème": "Il fait très beau, très chaud, et la piscine est pleine de monde. De tous les côtés, ça saute, ça crie. Les rires et les éclaboussures se mélangent, et on a l’impression qu’on ne pourra jamais trouver sa place dans toute cette pagaille éblouissante. Heureusement, le bassin est en forme de grand haricot, et il y a des espaces où l’on peut nager. Enfin, juste quelques brasses, avant de prendre un ballon sur la tête. Mais ce qui est magique, c’est que dès qu’on est dans l’eau, on ne sent plus du tout cette excitation. On est simplement bien, tout souple et léger, tout frais surtout.",
      "4ème": "Les yeux des êtres vivants possèdent la plus étonnante des propriétés : le regard. Il n’y a pas plus singulier. On ne dit pas des oreilles des créatures qu’elles ont un « écoutard », ni de leur narines qu’elles ont un « sentard » ou un « reniflard ». Qu’est-ce que le regard ? C’est inexprimable. Aucun mot ne peut approcher son essence étrange. Et pourtant, le regard existe. Il y a même peu de réalités qui existent à ce point. Quelle est la différence entre les yeux qui ont un regard et les yeux qui n’en n’ont pas ? Cette différence à un nom : c’est la vie. La vie commence là ou commence le regard.",
      "2nde": "Il y a des millions d’années que les fleurs fabriquent des épines. Il y a des millions d’années que les moutons mangent quand même les fleurs. Et ce n’est pas sérieux de chercher à comprendre pourquoi elles se donnent tant de mal pour se fabriquer des épines qui ne servent jamais à rien ? Ce n’est pas important la guerre des moutons et des fleurs ? Ce n’est pas plus sérieux et plus important que les additions d’un gros Monsieur rouge ? Et si je connais, moi, une fleur unique au monde, qui n’existe nulle part, sauf dans ma planète, et qu’un petit mouton peut anéantir d’un seul coup, comme ça, un matin, sans se rendre compte de ce qu’il fait, ce n’est pas important ça !"
    };

    // ========== NORMES EVIC (MPM) ==========
    const NORMES_EVIC = {
      copie: {
        CE1: { moy:7.6, et:2.0 }, CE2:{ moy:9.98, et:1.41 }, CM1:{ moy:12.25, et:2.5 }, CM2:{ moy:14.13, et:1.48 },
        "6ème":{ moy:16.31, et:4.78 }, "4ème":{ moy:21.28, et:3.17 }, "2nde":{ moy:22.69, et:3.38 }
      },
      repetition: {
        CE1:{ moy:9.2, et:2.22 }, CE2:{ moy:11.53, et:1.32 }, CM1:{ moy:15.65, et:2.7 }, CM2:{ moy:16.43, et:1.5 },
        "6ème":{ moy:17.77, et:5.46 }, "4ème":{ moy:20.29, et:4.09 }, "2nde":{ moy:23.07, et:2.73 }
      }
    };

    // ========== NAVIGATION ==========
    function showLogin() {
      const users = App.getUsers();
      App.render(`
        <div class="top-nav"><span class="logo">🧠 EViC-Adapt</span><span>Bilan numérique pour enfants Dys</span></div>
        <div class="card">
          <h2>Profil</h2>
          <select id="userSelect" style="width:100%; margin-bottom:1rem;"><option value="">-- Choisir un profil --</option>
            ${users.map(u=>`<option value="${u.id}">${u.nom} (${u.age} ans, ${u.groupe})</option>`).join('')}
          </select>
          <button class="btn" onclick="selectUser()">📂 Ouvrir</button>
          <hr style="margin:1rem 0"><h3>Nouveau profil</h3>
          <div class="grid" style="grid-template-columns:1fr auto auto auto auto auto;">
            <input id="newNom" placeholder="Nom complet">
            <input type="number" id="newAge" placeholder="Âge" min="3" max="18" value="8">
            <select id="newGroupe"><option value="dyslexie">Dyslexie</option><option value="dyspraxie">Dyspraxie</option><option value="dyscalculie">Dyscalculie</option><option value="mixte">Mixte</option></select>
            <select id="newNiveau"><option value="">Niveau scolaire</option><option value="CE1">CE1</option><option value="CE2">CE2</option><option value="CM1">CM1</option><option value="CM2">CM2</option><option value="6ème">6ème</option><option value="4ème">4ème</option><option value="2nde">2nde</option></select>
            <select id="newOrdiUsage"><option value="">Usage ordinateur</option><option value="debutant">Débutant</option><option value="intermediaire">Intermédiaire</option><option value="expert">Expert</option></select>
            <button class="btn" onclick="createUser()">➕ Créer</button>
          </div>
        </div>
      `);
    }


    function showDashboard() {
      if(!App.currentUser) return showLogin();
      const sessions = App.getSessions(App.currentUser.id);
      const hist = sessions.length ? sessions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(renderSessionHistoryItem).join('') : '<em>Aucune épreuve</em>';
      App.render(`
        <div class="top-nav">
          <span class="logo">🧠 EViC-Adapt</span>
          <button class="btn" onclick="showEpreuves()">🧪 Épreuves</button>
          <button class="btn" onclick="showRapport()">📊 Rapport détaillé</button>
          <button class="btn secondary" onclick="showObservateurQuestionnaire()">👀 Questionnaire observateur</button>
          <button class="btn secondary" onclick="showDataTools()">💾 Données</button>
          <button class="btn secondary" onclick="openSettings()">⚙️ Paramètres</button>
          <button class="btn secondary" onclick="showInfo()">ℹ️ Notation</button>
          <button class="btn secondary" onclick="logout()">↩️ Déconnexion</button>
        </div>
        <div class="card">
          <h2>👤 ${escapeHtml(App.currentUser.nom)} (${escapeHtml(App.currentUser.age)} ans, ${escapeHtml(App.currentUser.groupe)})</h2>
          ${App.currentUser.niveau ? `<p>Niveau scolaire : ${escapeHtml(App.currentUser.niveau)}</p>` : ''}
          ${App.currentUser.ordiUsage ? `<p>Usage ordinateur : ${escapeHtml(App.currentUser.ordiUsage)}</p>` : ''}
          <div class="toolbar-actions">
            <button class="btn success" onclick="showRapport()">📄 Préparer le rapport PDF</button>
            <button class="btn secondary" onclick="showObservateurQuestionnaire()">👀 Remplir le questionnaire observateur</button>
            <button class="btn secondary" onclick="exportCurrentUserCSV()">⬇️ Export CSV élève</button>
            <button class="btn secondary" onclick="exportCurrentUserJSON()">⬇️ Export JSON élève</button>
          </div>
          <h3>Historique</h3><p class="small-muted">Tu peux modifier une session, ajouter une note de contexte, l’exclure du rapport sans la supprimer, ou la supprimer définitivement.</p><div style="max-height:400px; overflow-y:auto;">${hist}</div>
        </div>
      `);
    }

    function showEpreuves() {
      App.render(`
        <div class="top-nav"><span class="logo">🧠 EViC-Adapt</span><button class="btn" onclick="showDashboard()">🏠 Accueil</button></div>
        <div class="card"><h2>📋 Épreuves</h2>
          <div class="grid">
            <button class="btn" onclick="Epreuves.Pointage.chooseMode()">🎯 Pointage</button>
            <button class="btn" onclick="Epreuves.GlisserDeposer.chooseMode()">🖐️ Glisser-déposer</button>
            <button class="btn" onclick="Epreuves.DoubleClic.chooseMode()">🖱️ Double-clic</button>
            <button class="btn" onclick="Epreuves.Dictee.chooseMode()">🔢 Dictée</button>
            <button class="btn" onclick="Epreuves.CalculMental.chooseMode()">🧮 Calcul</button>
            <button class="btn" onclick="Epreuves.Problemes.chooseMode()">📝 Problèmes</button>
            <button class="btn" onclick="Epreuves.CopieTexte.chooseMode()">✍️ Copie</button>
            <button class="btn" onclick="Epreuves.RepetitionMot.chooseMode()">🔁 Répétition</button>
            <button class="btn" onclick="Epreuves.Barrage.chooseMode()">🔍 Cherche trouve</button>
            <button class="btn" onclick="Epreuves.Assemblage.chooseMode()">🧩 Assemblage</button>
            <button class="btn" onclick="Epreuves.TracePrecision.chooseMode()">✏️ Tracé</button>
            <button class="btn" onclick="Epreuves.PointsARelier.chooseMode()">🔗 Points</button>
            <button class="btn" onclick="Epreuves.PerceptionVisuelle.chooseMode()">👁️ Identique</button>
            <button class="btn" onclick="Epreuves.TrailMaking.chooseMode()">🔀 Suite logique</button>
            <button class="btn" onclick="Epreuves.Memorisation.chooseMode()">🧠 Mémoire</button>
          </div>
        </div>
      `);
    }

    function showInfo() {
      App.render(`
        <div class="top-nav"><span class="logo">ℹ️ Barème de notation</span><button class="btn secondary" onclick="showDashboard()">Retour</button></div>
        <div class="card">
          <h2>Comment sont calculées les notes sur 10 ?</h2>
          <ul style="line-height:2;">
            <li><b>Pointage</b> : 70% précision + 30% vitesse</li>
            <li><b>Glisser-déposer</b> : 10 - temps/5 - erreurs×2</li>
            <li><b>Double-clic</b> : 10 - temps/3</li>
            <li><b>Dictée nombres</b> : (bonnes réponses / total) × 10</li>
            <li><b>Calcul, Problèmes, Identique</b> : (bonnes réponses / total) × 10</li>
            <li><b>Copie texte</b> : mots comptabilisés par minute ; fautes et ponctuation non comptées comme erreurs</li>
            <li><b>Répétition mot</b> : vitesse comparée aux normes du niveau quand il est renseigné</li>
            <li><b>Cherche trouve</b> : (trouvées/total×10) - fausses×1.5</li>
            <li><b>Assemblage</b> : 10 - temps/15 - |3 - formes|×2</li>
            <li><b>Tracé</b> : 10 - temps/25 - sorties×1.5</li>
            <li><b>Points à relier</b> : 10 - temps/8 - erreurs×2</li>
            <li><b>Suite logique</b> : 10 - temps/30 - erreurs×1.5</li>
            <li><b>Mémoire</b> : (éléments corrects / total × 10) - fausses sélections×0.5</li>
          </ul>
          <p style="margin-top:1rem;"><b>Interprétation :</b> ≥ 7 = facilité, ≥ 4 = difficulté modérée, &lt; 4 = difficulté importante.</p>
        </div>
      `);
    }

    function selectUser() {
      const id = document.getElementById('userSelect').value;
      if(!id) return alert('Choisissez un profil.');
      App.currentUser = App.getUsers().find(u=>u.id==id);
      localStorage.setItem('ergoeval_lastUser', App.currentUser.id);
      showDashboard();
    }
    function createUser() {
      const nom = document.getElementById('newNom').value.trim();
      const age = parseInt(document.getElementById('newAge').value);
      const groupe = document.getElementById('newGroupe').value;
      const niveau = document.getElementById('newNiveau').value;
      const ordiUsage = document.getElementById('newOrdiUsage').value;
      if(!nom || !age) return alert('Nom et âge requis.');
      const users = App.getUsers();
      const newUser = { id: Date.now().toString(), nom, age, groupe, niveau, ordiUsage };
      users.push(newUser); App.saveUsers(users);
      App.currentUser = newUser;
      localStorage.setItem('ergoeval_lastUser', newUser.id);
      showDashboard();
    }
    function logout() { App.currentUser = null; localStorage.removeItem('ergoeval_lastUser'); showLogin(); }
    function openSettings() {
      const s = App.settings;
      App.render(`
        <div class="top-nav"><span class="logo">Paramètres</span><button class="btn secondary" onclick="showDashboard()">Retour</button></div>
        <div class="card">
          <label>Thème : <select onchange="updateSetting('theme',this.value)">
            <option value="light" ${s.theme=='light'?'selected':''}>Clair</option>
            <option value="dark" ${s.theme=='dark'?'selected':''}>Sombre</option>
          </select></label>
          <label>Police : <select onchange="updateSetting('fontFamily',this.value)">
            <option value="Inter" ${s.fontFamily=='Inter'?'selected':''}>Inter</option>
            <option value="'OpenDyslexic', sans-serif" ${s.fontFamily.includes('OpenDyslexic')?'selected':''}>OpenDyslexic</option>
          </select></label>
          <label>Taille : <select onchange="updateSetting('fontSize',this.value)">
            <option value="normal" ${s.fontSize=='normal'?'selected':''}>Normal</option>
            <option value="large" ${s.fontSize=='large'?'selected':''}>Grand</option>
            <option value="xlarge" ${s.fontSize=='xlarge'?'selected':''}>Très grand</option>
          </select></label>
          <label>Sons : <input type="checkbox" ${s.soundEnabled?'checked':''} onchange="updateSetting('soundEnabled',this.checked)"></label>
        </div>
      `);
    }
    function updateSetting(k,v) { if(k==='soundEnabled') v = v===true||v==='true'; App.settings[k]=v; App.saveSettings(); }

    // ========== CATÉGORIES ET SCORES ==========
    const CATEGORIES = {
      'Clavier / transcription': ['Copie de texte', 'Répétition de mot', 'Dictée de nombres'],
      'Souris / pointage / manipulation': ['Pointage de cibles', 'Glisser-déposer', 'Double-clic / Clic droit'],
      'Contrôle du geste numérique': ['Tracé de précision', 'Points à relier'],
      'Repérage visuel / visuo-spatial': ['Cherche trouve', 'Identique', 'Assemblage de formes'],
      'Logique / planification': ['Suite logique'],
      'Calcul / raisonnement mathématique': ['Calcul mental', 'Problèmes'],
      'Mémoire visuelle': ['Mémorisation visuelle']
    };

    function clampScore(value, min = 0, max = 10) {
      const number = Number(value);
      if(!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    function scoreMpmNormatif(mpm, norme, fallbackReference = 20) {
      const vitesse = Number(mpm) || 0;
      if(norme && Number.isFinite(norme.moy) && Number.isFinite(norme.et) && norme.et > 0) {
        // Moyenne du niveau = 7/10 ; chaque écart-type vaut environ 2 points.
        const z = (vitesse - norme.moy) / norme.et;
        return clampScore(7 + z * 2);
      }
      return clampScore((vitesse / fallbackReference) * 10);
    }

    function normaliserScore(epreuve, score) {
      if(!score) return 0;
      switch(epreuve) {
        case 'Pointage de cibles': return clampScore(((score.precision||0)/10)*0.7 + Math.max(0,10-(parseFloat(score.totalSec)||60)/3)*0.3);
        case 'Glisser-déposer': return clampScore(10 - (parseFloat(score.temps)||30)/5 - (score.erreurs||0)*2);
        case 'Double-clic / Clic droit': return clampScore(10 - (parseFloat(score.temps)||20)/3);
        case 'Dictée de nombres': return clampScore(((score.correct||0) / (score.total||10)) * 10);
        case 'Calcul mental': return clampScore(((score.correct||0) / (score.total||8)) * 10);
        case 'Problèmes': return clampScore(((score.correct||0) / (score.total||4)) * 10);
        case 'Copie de texte': {
          let mpm = Number(score.mpmEvic) || 0;
          if(!mpm && score.caracteres && (score.tempsSecondes || score.temps)) {
            const tempsCopie = Number(score.tempsSecondes || score.temps) || 0;
            mpm = tempsCopie ? ((Number(score.caracteres) || 0) / tempsCopie * 60) / 6 : 0;
          }
          const niveau = score.niveau || App.currentUser?.niveau;
          const vitesseScore = scoreMpmNormatif(mpm, NORMES_EVIC.copie?.[niveau], 20);
          let penaliteQualite = 0;
          if(score.precisionPct !== undefined) {
            // La précision baisse la note, sans annuler totalement une bonne vitesse.
            penaliteQualite = clampScore((100 - Number(score.precisionPct)) / 8, 0, 4);
          } else {
            // Compatibilité avec les anciennes sessions : évite les 0 artificiels dus aux mots non copiés.
            const caracteres = Number(score.caracteres) || 0;
            const approxMots = Math.max(1, caracteres / 6);
            const tauxErreurs = (Number(score.erreurs) || 0) / approxMots;
            penaliteQualite = clampScore(tauxErreurs * 2.5, 0, 3.5);
          }
          if(score.corrections !== undefined) penaliteQualite += clampScore((Number(score.corrections) || 0) / 25, 0, 1);
          return clampScore(vitesseScore - penaliteQualite);
        }
        case 'Répétition de mot': {
          let mpm = Number(score.mpmEvic) || 0;
          if(!mpm && score.caracteres && (score.tempsSecondes || score.temps)) {
            const tempsRep = Number(score.tempsSecondes || score.temps) || 0;
            mpm = tempsRep ? ((Number(score.caracteres) || 0) / tempsRep * 60) / 6 : 0;
          }
          const niveau = score.niveau || App.currentUser?.niveau;
          return scoreMpmNormatif(mpm, NORMES_EVIC.repetition?.[niveau], 15);
        }
        case 'Cherche trouve': return clampScore(((score.trouvees||0)/(score.cibles||25))*10 - (score.fausses||0)*1.5);
        case 'Assemblage de formes': return clampScore(10 - (parseFloat(score.temps)||30)/15 - Math.abs(3-(score.formes||0))*2);
        case 'Tracé de précision': return clampScore(10 - (parseFloat(score.temps)||30)/25 - (score.sorties||0)*1.5);
        case 'Points à relier': return clampScore(10 - (parseFloat(score.temps)||30)/8 - (score.erreurs||0)*2);
        case 'Identique': return clampScore(((score.correct||0) / (score.total||10)) * 10);
        case 'Suite logique': return clampScore(10 - (parseFloat(score.temps)||30)/30 - (score.erreurs||0)*1.5);
        case 'Mémorisation visuelle': {
          const correct = Number(score.correct) || 0;
          const errors = Number(score.errors) || 0;
          const total = Number(score.total) || 6;
          // On valorise les éléments correctement retrouvés ; les fausses sélections retirent peu de points.
          return clampScore((correct / total) * 10 - errors * 0.5);
        }
        default: return 0;
      }
    }

    function calculerNotes(sessions) {
      const notesParEpreuve = {};
      sessions.forEach(s => {
        if(!notesParEpreuve[s.epreuve]) notesParEpreuve[s.epreuve] = {};
        if(!notesParEpreuve[s.epreuve][s.mode]) notesParEpreuve[s.epreuve][s.mode] = [];
        notesParEpreuve[s.epreuve][s.mode].push(normaliserScore(s.epreuve, s.score));
      });
      const moyenneEpreuve = {};
      for(const [ep, modes] of Object.entries(notesParEpreuve)) {
        const allNotes = [];
        for(const notes of Object.values(modes)) allNotes.push(...notes);
        if(allNotes.length) moyenneEpreuve[ep] = allNotes.reduce((a,b)=>a+b,0)/allNotes.length;
      }
      const categories = {};
      for(const [cat, epreuves] of Object.entries(CATEGORIES)) {
        let somme = 0, nb = 0;
        epreuves.forEach(ep => { if(moyenneEpreuve[ep]!==undefined) { somme += moyenneEpreuve[ep]; nb++; } });
        categories[cat] = nb > 0 ? somme / nb : 0;
      }
      return { parEpreuve: moyenneEpreuve, categories, notesParEpreuve };
    }

    function filterEvaluatedCategories(categories, parEpreuve) {
      return Object.fromEntries(Object.entries(categories).filter(([cat]) =>
        (CATEGORIES[cat] || []).some(epreuve => Object.prototype.hasOwnProperty.call(parEpreuve, epreuve))
      ));
    }

    function categoryScoreNeedsRecommendation(categories, categoryName) {
      return Object.prototype.hasOwnProperty.call(categories, categoryName) && categories[categoryName] < 4;
    }


    // ========== OUTILS RAPPORT / EXPORT / ACCÈS ==========
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }

    function getAllSessionsRaw() {
      const all = JSON.parse(localStorage.getItem('ergoeval_sessions') || '[]');
      let changed = false;
      all.forEach((session, index) => {
        if(!session.id) {
          session.id = `${session.date || Date.now()}_${session.userId || 'user'}_${index}`;
          changed = true;
        }
        if(session.contextNote === undefined) { session.contextNote = ''; changed = true; }
        if(session.excludedFromReport === undefined) { session.excludedFromReport = false; changed = true; }
      });
      if(changed) localStorage.setItem('ergoeval_sessions', JSON.stringify(all));
      return all;
    }

    function saveAllSessionsRaw(sessions) {
      localStorage.setItem('ergoeval_sessions', JSON.stringify(sessions));
    }

    function getUserById(id) {
      return App.getUsers().find(u => String(u.id) === String(id)) || null;
    }

    function safeFileName(value) {
      return String(value || 'export').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '').slice(0,80) || 'export';
    }

    function downloadTextFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
    }

    function csvCell(value) {
      const s = String(value ?? '');
      return '"' + s.replace(/"/g, '""') + '"';
    }

    function sessionToCsvRow(s, user) {
      const score = s.score || {};
      const note = normaliserScore(s.epreuve, score);
      return [
        s.date || '',
        user?.nom || '',
        user?.age || '',
        user?.niveau || '',
        user?.groupe || '',
        user?.ordiUsage || '',
        s.epreuve || '',
        s.mode || '',
        Number.isFinite(note) ? note.toFixed(2) : '',
        score.caracteres ?? '',
        score.tempsSecondes ?? score.temps ?? score.totalSec ?? '',
        score.mpmEvic ?? '',
        score.erreurs ?? score.errors ?? '',
        score.correct ?? '',
        score.total ?? '',
        score.precision ?? '',
        s.sentiment || '',
        s.contextNote || '',
        s.excludedFromReport ? 'oui' : 'non',
        JSON.stringify(score)
      ].map(csvCell).join(';');
    }

    function sessionsToCSV(sessions) {
      const headers = ['date','eleve','age','niveau','groupe','usage_ordinateur','epreuve','mode','note_sur_10','caracteres','temps_secondes','mpm_evic','erreurs','correct','total','precision','ressenti','note_contexte','exclu_du_rapport','score_json'];
      const rows = sessions.map(s => sessionToCsvRow(s, getUserById(s.userId)));
      return '\uFEFF' + headers.map(csvCell).join(';') + '\n' + rows.join('\n');
    }

    function exportCurrentUserCSV() {

      downloadTextFile(`EViC_Adapt_historique_${safeFileName(App.currentUser.nom)}_${new Date().toISOString().slice(0,10)}.csv`, sessionsToCSV(sessions), 'text/csv');

    function importSessionsJSONFromInput(input) {
      const file = input.files && input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const incomingUsers = Array.isArray(data.users) ? data.users : (data.user ? [data.user] : []);
          const incomingSessions = Array.isArray(data.sessions) ? data.sessions : (Array.isArray(data) ? data : []);
          if(!incomingSessions.length && !incomingUsers.length) throw new Error('Format JSON non reconnu.');

          const users = App.getUsers();
          const userIds = new Set(users.map(u => String(u.id)));
          incomingUsers.forEach(u => {
            if(u && u.id && !userIds.has(String(u.id))) { users.push(u); userIds.add(String(u.id)); }
          });
          App.saveUsers(users);

          if(data.observateurs && typeof data.observateurs === 'object') {
            const currentObs = getAllObserverData();
            saveAllObserverData({ ...currentObs, ...data.observateurs });
          } else if(data.observateur && data.user && data.user.id) {
            const currentObs = getAllObserverData();
            currentObs[String(data.user.id)] = data.observateur;
            saveAllObserverData(currentObs);
          }

          const all = getAllSessionsRaw();
          const keys = new Set(all.map(s => String(s.id || '') + '|' + String(s.date || '') + '|' + String(s.userId || '') + '|' + String(s.epreuve || '')));
          let added = 0;
          incomingSessions.forEach(s => {
            if(!s || !s.epreuve) return;
            if(!s.id) s.id = Date.now().toString() + '_' + Math.random().toString(36).slice(2,8);
            const key = String(s.id || '') + '|' + String(s.date || '') + '|' + String(s.userId || '') + '|' + String(s.epreuve || '');
            if(!keys.has(key)) { all.push(s); keys.add(key); added++; }
          });
          localStorage.setItem('ergoeval_sessions', JSON.stringify(all));
          alert(`${added} session(s) importée(s).`);
          showDataTools();
        } catch(e) {
          alert('Import impossible : ' + e.message);
        }
      };
      reader.onloadend = () => { input.value = ''; };
      reader.readAsText(file);
    }

    function buildConclusion(categories, sessions) {
      const done = Object.keys(sessions.reduce((acc, session) => { acc[session.epreuve] = true; return acc; }, {})).length;
      const faibles = Object.entries(categories).filter(([_, note]) => note > 0 && note < 4).map(([cat]) => cat);
      const fragiles = Object.entries(categories).filter(([_, note]) => note >= 4 && note < 7).map(([cat]) => cat);
      if(!done) return 'Aucune conclusion possible : aucune épreuve n’a été retenue dans le rapport.';
      if(faibles.length) return `Le bilan met en évidence des difficultés importantes dans les domaines suivants : ${faibles.join(', ')}. Des adaptations ciblées sont à envisager, en tenant compte des observations de l’adulte, du contexte scolaire et des conditions de passation.`;
      if(fragiles.length) return `Le bilan montre des fragilités dans les domaines suivants : ${fragiles.join(', ')}. Les résultats doivent être mis en lien avec les observations qualitatives et les besoins fonctionnels de l’élève.`;
      return 'Les résultats retenus dans ce rapport ne mettent pas en évidence de difficulté majeure dans les domaines évalués. Une poursuite de l’observation reste recommandée selon les besoins scolaires.';
    }

    function buildAutoSummary(categories, parEpreuve, sessions, observerData, excludedCount, totalSessions) {
      const epreuvesRealisees = [...new Set(sessions.map(session => session.epreuve))];
      const forces = Object.entries(categories).filter(([_, note]) => note >= 7).map(([cat]) => cat);
      const fragilites = Object.entries(categories).filter(([_, note]) => note >= 4 && note < 7).map(([cat]) => cat);
      const difficultes = Object.entries(categories).filter(([_, note]) => note > 0 && note < 4).map(([cat]) => cat);
      const faiblesEpreuves = Object.entries(parEpreuve).filter(([_, note]) => note < 4).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([ep, note]) => `${ep} (${note.toFixed(1)}/10)`);
      const comprehension = (observerData?.comprehension || []).filter(value => value && value !== 'Non observé');
      const clavier = (observerData?.globalKeyboard || []).filter(value => value && value !== 'Non observé');

      const points = [];
      points.push(`${epreuvesRealisees.length} épreuve(s) retenue(s) dans ce rapport sur ${totalSessions} session(s) enregistrée(s).`);
      if(excludedCount) points.push(`${excludedCount} session(s) ont été exclue(s) volontairement du rapport, sans être supprimée(s) de l’historique.`);
      if(forces.length) points.push(`Points d’appui principaux : ${forces.join(', ')}.`);
      if(fragilites.length) points.push(`Fragilités à surveiller : ${fragilites.join(', ')}.`);
      if(difficultes.length) points.push(`Difficultés importantes repérées : ${difficultes.join(', ')}.`);
      if(faiblesEpreuves.length) points.push(`Épreuves les plus fragiles : ${faiblesEpreuves.join(', ')}.`);
      if(comprehension.length) points.push(`Compréhension des consignes : ${comprehension.join(', ')}.`);
      if(clavier.length) points.push(`Utilisation globale du clavier : ${clavier.join(', ')}.`);
      if(points.length === 1) points.push('Aucune alerte majeure n’apparaît dans les scores retenus ; l’interprétation doit rester croisée avec les observations en situation réelle.');
      return `<ul>${points.map(point => `<li>${escapeHtml(point)}</li>`).join('')}</ul>`;
    }

    function formatScoreDetailsWithSession(session) {
      let details = formatScoreDetails(session.score);
      if((session.contextNote || '').trim()) {
        details += `${details ? '<br>' : ''}<b>Note contexte :</b><br>${escapeHtml(session.contextNote).replace(/\n/g, '<br>')}`;
      }
      return details;
    }

    function formatScoreDetails(score) {
      if(!score) return '';
      const parts = [];
      if(score.motsParMinute !== undefined) parts.push(`Mots/min : ${Number(score.motsParMinute).toFixed(1)}`);
      else if(score.mpmEvic !== undefined) parts.push(`MPM EVIC : ${Number(score.mpmEvic).toFixed(1)}`);
      if(score.motsComptes !== undefined) parts.push(`Mots comptabilisés : ${score.motsComptes}`);
      if(score.caracteres !== undefined) parts.push(`Caractères : ${score.caracteres}`);
      if(score.tempsSecondes !== undefined) parts.push(`Temps : ${Number(score.tempsSecondes).toFixed(1)} s`);
      if(score.temps !== undefined) parts.push(`Temps : ${score.temps} s`);
      if(score.totalSec !== undefined) parts.push(`Temps : ${score.totalSec} s`);
      if(score.erreurs !== undefined) parts.push(`Erreurs : ${score.erreurs}`);
      if(score.erreursTexte !== undefined && (!score.methodeComptage || Number(score.erreursTexte) > 0)) parts.push(`Erreurs de copie : ${score.erreursTexte}`);
      if(score.corrections !== undefined) parts.push(`Corrections / effacements : ${score.corrections}`);
      if(score.motsSaisis !== undefined && score.motsComptes === undefined) parts.push(`Mots saisis : ${score.motsSaisis}`);
      if(score.methodeComptage !== undefined) parts.push(score.methodeComptage);
      if(score.errors !== undefined) parts.push(`Fausses sélections : ${score.errors}`);
      if(score.correct !== undefined && score.total !== undefined) parts.push(`Correct : ${score.correct}/${score.total}`);
      if(score.precisionPct !== undefined) parts.push(`Précision copie : ${Number(score.precisionPct).toFixed(1)}%`);
      if(score.precision !== undefined) parts.push(`Précision : ${score.precision}%`);
      if(score.sorties !== undefined) parts.push(`Sorties : ${score.sorties}`);
      if(score.trouvees !== undefined && score.cibles !== undefined) parts.push(`Cibles : ${score.trouvees}/${score.cibles}`);
      if(score.fausses !== undefined) parts.push(`Fausses réponses : ${score.fausses}`);
      if(!parts.length) return escapeHtml(JSON.stringify(score));
      return parts.map(escapeHtml).join('<br>');
    }


    // ========== GESTION DE L'HISTORIQUE ET FILTRE DU RAPPORT ==========

    function toDateTimeLocal(value) {
      const date = value ? new Date(value) : new Date();
      if(Number.isNaN(date.getTime())) return '';
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0,16);
    }

    function renderSessionHistoryItem(session) {
      const note = normaliserScore(session.epreuve, session.score);
      const excluded = !!session.excludedFromReport;
      const noteHtml = Number.isFinite(note) ? `${note.toFixed(1)}/10` : '—';
      return `<div class="session-item ${excluded ? 'excluded' : ''}">

          <div>
            <b>${escapeHtml(session.epreuve)}</b> <span class="small-muted">${escapeHtml(session.mode || '')}</span><br>

    function showEditSession(sessionId) {
      const session = getSessionById(sessionId);
      if(!session) return alert('Session introuvable.');
      const epreuveOptions = getKnownEpreuveNames().map(name => `<option value="${escapeHtml(name)}" ${name===session.epreuve?'selected':''}>${escapeHtml(name)}</option>`).join('');
      App.render(`
        <div class="top-nav"><span class="logo">Modifier une session</span><button class="btn secondary" onclick="showDashboard()">Retour</button></div>
        <div class="card">
          <h2>Modifier l’épreuve enregistrée</h2>
          <p class="small-muted">Ces modifications concernent uniquement l’historique et le rapport. Elles ne changent pas le fonctionnement des épreuves.</p>
          <label>Épreuve</label>
          <select id="editSessionEpreuve" style="width:100%;margin:0.35rem 0 0.8rem;">${epreuveOptions}</select>
          <label>Mode</label>
          <select id="editSessionMode" style="width:100%;margin:0.35rem 0 0.8rem;">

            <option value="papier" ${session.mode==='papier'?'selected':''}>Papier</option>

          <label class="check-option" style="margin:0.5rem 0 1rem;"><input id="editSessionExcluded" type="checkbox" ${session.excludedFromReport?'checked':''}> Exclure cette session du rapport détaillé sans la supprimer</label>

            <button class="btn success" onclick="saveSessionEdit(${jsArg(session.id)})">Enregistrer</button>
            <button class="btn warning" onclick="deleteSessionById(${jsArg(session.id)})">Supprimer cette session</button>
            <button class="btn secondary" onclick="showDashboard()">Annuler</button>
          </div>
        </div>
      `);
    }

    function saveSessionEdit(sessionId) {
      const ok = updateSessionById(sessionId, session => {
        session.epreuve = document.getElementById('editSessionEpreuve').value;
        session.mode = document.getElementById('editSessionMode').value;
        const dateValue = document.getElementById('editSessionDate').value;
        if(dateValue) session.date = new Date(dateValue).toISOString();
        session.contextNote = document.getElementById('editSessionNote').value.trim();
        session.excludedFromReport = document.getElementById('editSessionExcluded').checked;
      });
      if(!ok) return alert('Session introuvable.');
      showDashboard();
    }

    function toggleSessionReportInclusion(sessionId) {
      const ok = updateSessionById(sessionId, session => {
        session.excludedFromReport = !session.excludedFromReport;
      });
      if(!ok) return alert('Session introuvable.');
      showDashboard();
    }

    function getReportFilterKey(userId = App.currentUser?.id) {
      return `evic_report_filter_${userId}`;
    }

    function uniqueEpreuveNamesFromSessions(sessions) {
      return [...new Set(sessions.map(session => session.epreuve).filter(Boolean))];
    }

    function getSelectedReportEpreuves(userId, availableNames) {
      try {
        const saved = JSON.parse(localStorage.getItem(getReportFilterKey(userId)) || 'null');
        if(Array.isArray(saved) && saved.length) {
          const selected = saved.filter(name => availableNames.includes(name));
          return selected.length ? selected : availableNames;
        }
      } catch(error) {}
      return availableNames;
    }

    function buildReportFilterHtml(availableNames, selectedNames, excludedCount) {
      if(!availableNames.length) return '';
      const options = availableNames.map(name => `
        <label class="check-option"><input type="checkbox" class="report-filter-choice" value="${escapeHtml(name)}" ${selectedNames.includes(name)?'checked':''}> ${escapeHtml(name)}</label>
      `).join('');
      return `<div class="filter-panel no-print">
        <h3>Épreuves à inclure dans le rapport</h3>
        <p class="small-muted">Décoche les épreuves que tu ne veux pas afficher dans ce rapport. Les sessions exclues individuellement dans l’historique ne sont jamais intégrées.</p>
        ${excludedCount ? `<p class="small-muted"><b>${excludedCount}</b> session(s) exclue(s) depuis l’historique.</p>` : ''}
        <div class="check-list">${options}</div>
        <div class="toolbar-actions">
          <button class="btn success" onclick="saveReportFilterFromForm()">Actualiser le rapport</button>
          <button class="btn secondary" onclick="resetReportFilter()">Tout inclure</button>
        </div>
      </div>`;
    }

    function saveReportFilterFromForm() {
      if(!App.currentUser) return showLogin();
      const selected = [...document.querySelectorAll('.report-filter-choice:checked')].map(el => el.value);
      if(!selected.length) return alert('Sélectionne au moins une épreuve à inclure dans le rapport.');
      localStorage.setItem(getReportFilterKey(App.currentUser.id), JSON.stringify(selected));
      showRapport();
    }

    function resetReportFilter() {
      if(!App.currentUser) return showLogin();
      localStorage.removeItem(getReportFilterKey(App.currentUser.id));
      showRapport();
    }

    // ========== QUESTIONNAIRE OBSERVATEUR ==========

    function defaultObserverData() {
      const epreuves = {};
      OBS_EPREEUVES.forEach(ep => { epreuves[ep.id] = { nom: ep.nom, modeFrappe: [], choix: [], observation: '' }; });
      return {
        updatedAt: '',
        comprehension: [],
        comprehensionObservation: '',
        epreuves,
        globalKeyboard: [],
        globalKeyboardObservation: '',
        pointsAppui: [],
        difficultes: [],
        remarqueGlobale: '',
        adaptations: ''
      };
    }

    function getAllObserverData() {
      return JSON.parse(localStorage.getItem(OBSERVER_STORAGE_KEY) || '{}');
    }

    function saveAllObserverData(data) {
      localStorage.setItem(OBSERVER_STORAGE_KEY, JSON.stringify(data));
    }

    function getObserverData(userId = App.currentUser?.id) {
      const all = getAllObserverData();
      const saved = all[String(userId)] || {};
      const base = defaultObserverData();
      const merged = { ...base, ...saved, epreuves: { ...base.epreuves, ...(saved.epreuves || {}) } };
      OBS_EPREEUVES.forEach(ep => {
        merged.epreuves[ep.id] = { nom: ep.nom, modeFrappe: [], choix: [], observation: '', ...(merged.epreuves[ep.id] || {}) };
      });
      return merged;
    }

    function saveObserverData(userId, data) {
      const all = getAllObserverData();
      all[String(userId)] = { ...data, userId:String(userId), updatedAt:new Date().toISOString() };
      saveAllObserverData(all);
    }

    function deleteObserverDataForCurrentUser() {
      if(!App.currentUser) return showLogin();
      if(!confirm('Effacer le questionnaire observateur de cet élève ?')) return;
      const all = getAllObserverData();
      delete all[String(App.currentUser.id)];
      saveAllObserverData(all);
      showObservateurQuestionnaire();
    }

    function hasObserverData(data) {
      if(!data) return false;
      if((data.comprehension || []).length || (data.comprehensionObservation || '').trim()) return true;
      if((data.globalKeyboard || []).length || (data.globalKeyboardObservation || '').trim()) return true;
      if((data.pointsAppui || []).length || (data.difficultes || []).length) return true;
      if((data.remarqueGlobale || '').trim() || (data.adaptations || '').trim()) return true;
      return Object.values(data.epreuves || {}).some(v => (v.modeFrappe || []).length || (v.choix || []).length || (v.observation || '').trim());
    }

    function checkedAttr(values, value) {
      return Array.isArray(values) && values.includes(value) ? 'checked' : '';
    }

    function checkboxGroup(name, choices, selected) {
      return `<div class="check-list">${choices.map(choice => `<label class="check-option"><input type="checkbox" name="${name}" value="${escapeHtml(choice)}" ${checkedAttr(selected, choice)}> <span>${escapeHtml(choice)}</span></label>`).join('')}</div>`;
    }

    function checkedValues(name) {
      return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(el => el.value);
    }

    function textValue(id) {
      return document.getElementById(id)?.value.trim() || '';
    }

    function showObservateurQuestionnaire() {
      if(!App.currentUser) return showLogin();
      const data = getObserverData(App.currentUser.id);
      const epreuveBlocks = OBS_EPREEUVES.map(ep => {
        const saved = data.epreuves[ep.id] || { modeFrappe: [], choix: [], observation: '' };
        return `
          <div class="observer-section">
            <h3>${escapeHtml(ep.nom)}</h3>
            ${ep.keyboard ? `<p><b>Mode de frappe observé :</b></p>${checkboxGroup('obs_' + ep.id + '_keyboard', OBS_KEYBOARD_CHOICES, saved.modeFrappe)}` : ''}
            <p><b>${escapeHtml(ep.question)}</b></p>
            ${checkboxGroup('obs_' + ep.id, ep.choices, saved.choix)}
            <label>Observation si nécessaire :</label>
            <textarea id="obs_${ep.id}_text" rows="2" style="width:100%;" placeholder="Observation facultative...">${escapeHtml(saved.observation || '')}</textarea>
          </div>`;
      }).join('');

      App.render(`
        <div class="top-nav">
          <span class="logo">👀 Questionnaire observateur</span>
          <button class="btn success" onclick="saveObservateurQuestionnaire()">💾 Enregistrer</button>
          <button class="btn secondary" onclick="showDashboard()">Retour</button>
        </div>
        <div class="card">
          <h2>Questionnaire observateur</h2>
          <p class="observer-note">Cette partie est séparée des épreuves. Elle est destinée à l’adulte observateur et sera intégrée automatiquement au rapport détaillé de l’élève.</p>
          <p><b>Élève :</b> ${escapeHtml(App.currentUser.nom)} ${App.currentUser.niveau ? `— ${escapeHtml(App.currentUser.niveau)}` : ''}</p>

          <div class="observer-section">
            <h3>1. Compréhension globale des consignes</h3>
            <p><b>Pendant l’ensemble des épreuves, l’élève :</b></p>
            ${checkboxGroup('obs_comprehension', OBS_COMPREHENSION_CHOICES, data.comprehension)}
            <label>Observation sur la compréhension des consignes :</label>
            <textarea id="obs_comprehension_text" rows="3" style="width:100%;" placeholder="Observation facultative...">${escapeHtml(data.comprehensionObservation || '')}</textarea>
          </div>

          <h2>Observations par épreuve</h2>
          ${epreuveBlocks}

          <div class="observer-section">
            <h3>Synthèse générale de l’observateur</h3>
            <p><b>Utilisation globale du clavier :</b></p>
            ${checkboxGroup('obs_global_keyboard', OBS_KEYBOARD_CHOICES, data.globalKeyboard)}
            <label>Observation générale sur la frappe clavier :</label>
            <textarea id="obs_global_keyboard_text" rows="3" style="width:100%;" placeholder="Observation facultative...">${escapeHtml(data.globalKeyboardObservation || '')}</textarea>

            <p style="margin-top:1rem;"><b>Points d’appui observés :</b></p>
            ${checkboxGroup('obs_points_appui', OBS_APPUI_CHOICES, data.pointsAppui)}

            <p style="margin-top:1rem;"><b>Difficultés principales observées :</b></p>
            ${checkboxGroup('obs_difficultes', OBS_DIFFICULTE_CHOICES, data.difficultes)}

            <label>Remarque globale sur la passation :</label>
            <textarea id="obs_remarque_globale" rows="3" style="width:100%;" placeholder="Observation facultative...">${escapeHtml(data.remarqueGlobale || '')}</textarea>

            <label>Adaptations à envisager :</label>
            <textarea id="obs_adaptations" rows="3" style="width:100%;" placeholder="Exemples : clavier avec repères visuels, consignes reformulées, temps supplémentaire...">${escapeHtml(data.adaptations || '')}</textarea>
          </div>

          <div class="toolbar-actions">
            <button class="btn success" onclick="saveObservateurQuestionnaire()">💾 Enregistrer le questionnaire</button>
            <button class="btn" onclick="showRapport()">📊 Voir le rapport détaillé</button>
            <button class="btn secondary" onclick="deleteObserverDataForCurrentUser()">🗑️ Effacer le questionnaire</button>
            <button class="btn secondary" onclick="showDashboard()">Retour tableau de bord</button>
          </div>
        </div>
      `);
    }

    function saveObservateurQuestionnaire() {
      if(!App.currentUser) return showLogin();
      const data = defaultObserverData();
      data.comprehension = checkedValues('obs_comprehension');
      data.comprehensionObservation = textValue('obs_comprehension_text');
      OBS_EPREEUVES.forEach(ep => {
        data.epreuves[ep.id] = {
          nom: ep.nom,
          modeFrappe: ep.keyboard ? checkedValues('obs_' + ep.id + '_keyboard') : [],
          choix: checkedValues('obs_' + ep.id),
          observation: textValue('obs_' + ep.id + '_text')
        };
      });
      data.globalKeyboard = checkedValues('obs_global_keyboard');
      data.globalKeyboardObservation = textValue('obs_global_keyboard_text');
      data.pointsAppui = checkedValues('obs_points_appui');
      data.difficultes = checkedValues('obs_difficultes');
      data.remarqueGlobale = textValue('obs_remarque_globale');
      data.adaptations = textValue('obs_adaptations');
      saveObserverData(App.currentUser.id, data);
      alert('Questionnaire observateur enregistré. Il sera intégré au rapport détaillé.');
      showDashboard();
    }

    function formatObserverText(value) {
      return escapeHtml(value || '').replace(/\n/g, '<br>');
    }

    function observerList(values) {
      if(!values || !values.length) return '<em>Non renseigné</em>';
      return `<ul>${values.map(v => `<li>${escapeHtml(v)}</li>`).join('')}</ul>`;
    }

    function observerDetailsForEpreuve(data, epreuveName) {
      if(!data || !data.epreuves) return '<em>Non renseigné</em>';
      const aliases = {
        'Barrage visuel': 'Cherche trouve',
        'Trail Making': 'Suite logique',
        'Perception visuelle': 'Identique'
      };
      const nomRecherche = aliases[epreuveName] || epreuveName;
      const ep = OBS_EPREEUVES.find(item => item.nom === nomRecherche || item.nom === epreuveName);
      if(!ep) return '<em>Non renseigné</em>';
      const item = data.epreuves?.[ep.id];
      if(!item) return '<em>Non renseigné</em>';

      const details = [];
      if((item.modeFrappe || []).length) details.push(`<b>Frappe :</b> ${escapeHtml(item.modeFrappe.join(', '))}`);
      if((item.choix || []).length) details.push(`<b>Observation :</b> ${escapeHtml(item.choix.join(', '))}`);
      if((item.observation || '').trim()) details.push(`<b>Commentaire :</b><br>${formatObserverText(item.observation)}`);
      return details.length ? details.join('<br>') : '<em>Non renseigné</em>';
    }

    function buildObserverReportHtml(data) {
      if(!hasObserverData(data)) {
        return `<div class="report-section"><h2>👀 Questionnaire observateur</h2><p>Aucun questionnaire observateur renseigné.</p></div>`;
      }

      const hasComprehension = (data.comprehension || []).length || (data.comprehensionObservation || '').trim();
      const hasSynthese = (data.globalKeyboard || []).length || (data.globalKeyboardObservation || '').trim() ||
        (data.pointsAppui || []).length || (data.difficultes || []).length ||
        (data.remarqueGlobale || '').trim() || (data.adaptations || '').trim();
      const hasEpreuveObservations = Object.values(data.epreuves || {}).some(item =>
        (item.modeFrappe || []).length || (item.choix || []).length || (item.observation || '').trim()
      );

      let comprehensionHtml = '';
      if(hasComprehension) {
        comprehensionHtml = `
          <h3>Compréhension globale des consignes</h3>
          ${observerList(data.comprehension)}
          ${(data.comprehensionObservation || '').trim() ? `<p><b>Observation :</b><br>${formatObserverText(data.comprehensionObservation)}</p>` : ''}`;
      }

      let syntheseHtml = '';
      if(hasSynthese) {
        syntheseHtml = `
          <h3>Synthèse générale</h3>
          <table class="report-table">
            <tbody>
              <tr><th>Utilisation globale du clavier</th><td>${observerList(data.globalKeyboard)}${(data.globalKeyboardObservation || '').trim() ? `<p><b>Observation :</b><br>${formatObserverText(data.globalKeyboardObservation)}</p>` : ''}</td></tr>
              <tr><th>Points d’appui observés</th><td>${observerList(data.pointsAppui)}</td></tr>
              <tr><th>Difficultés principales observées</th><td>${observerList(data.difficultes)}</td></tr>
              <tr><th>Remarque globale</th><td>${(data.remarqueGlobale || '').trim() ? formatObserverText(data.remarqueGlobale) : '<em>Non renseigné</em>'}</td></tr>
              <tr><th>Adaptations à envisager</th><td>${(data.adaptations || '').trim() ? formatObserverText(data.adaptations) : '<em>Non renseigné</em>'}</td></tr>
            </tbody>
          </table>`;
      }

      const epreuveNote = hasEpreuveObservations
        ? '<p><em>Les observations par épreuve sont intégrées directement dans le tableau “Résultats détaillés”.</em></p>'
        : '';

      return `

    function buildStandaloneReportHtml() {
      updatePrintableReportComment();
      const report = document.getElementById('printReport');
      if(!report) throw new Error('Aucun rapport affiché à sauvegarder.');

      const clone = report.cloneNode(true);
      const originalCanvases = report.querySelectorAll('canvas');
      const clonedCanvases = clone.querySelectorAll('canvas');
      clonedCanvases.forEach((canvas, index) => {
        const original = originalCanvases[index];
        if(!original) return;
        try {
          const img = document.createElement('img');
          img.src = original.toDataURL('image/png');
          img.alt = 'Graphique du rapport';
          img.style.maxWidth = '100%';
          img.style.height = 'auto';
          canvas.replaceWith(img);
        } catch(error) {
          canvas.replaceWith(document.createTextNode('Graphique non exportable.'));
        }
      });

      clone.querySelectorAll('.screen-only, .no-print').forEach(element => element.remove());
      clone.querySelectorAll('.print-only').forEach(element => { element.style.display = 'block'; });

      const styles = Array.from(document.querySelectorAll('style')).map(style => style.textContent).join('\n');
      const title = getReportFileBaseName();
      return `<!DOCTYPE html>

    async function saveBlobWithPicker(filename, content, mimeType, extension) {
      const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
      if(window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: `Fichier ${extension.toUpperCase()}`, accept: { [mimeType]: ['.' + extension] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          alert('Bilan sauvegardé sur l’ordinateur.');
          return;
        } catch(error) {
          if(error && error.name === 'AbortError') return;
          console.warn('Sauvegarde avec choix d’emplacement impossible, téléchargement classique utilisé.', error);
        }
      }
      downloadTextFile(filename, content, mimeType);
      alert('Le navigateur ne permet pas le choix direct de l’emplacement. Le fichier a été téléchargé dans le dossier de téléchargement par défaut.');
    }

    async function saveCurrentReportHTML() {
      try {
        const filename = getReportFileBaseName() + '.html';

        await saveBlobWithPicker(filename, content, 'text/html', 'html');
      } catch(error) {
        alert('Sauvegarde impossible : ' + error.message);
      }
    }

    // ========== OUTILS D'ANALYSE ==========
    function nettoyerTokenCopie(token) {
      return String(token || '')
        .replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '')
        .trim();
    }

    function compterMotsCopie(texteSaisi) {
      // Comptage volontairement simple : un mot = un groupe de caractères séparé par un espace.
      // L'orthographe, les accents, les majuscules et la ponctuation ne sont pas comptés comme erreurs.
      return String(texteSaisi || '')
        .trim()
        .split(/\s+/)
        .map(nettoyerTokenCopie)
        .filter(Boolean).length;
    }

    function analyserCopieTexte(texteModele, texteSaisi) {
      const motsSaisis = compterMotsCopie(texteSaisi);
      return {
        motsSaisis,
        motsComptes: motsSaisis,
        erreursTexte: 0,
        precisionPct: motsSaisis > 0 ? 100 : 0,
        methode: 'Comptage des mots séparés par des espaces ; fautes et ponctuation non comptabilisées comme erreurs.'
      };
    }

          case 'Copie de texte': { const motsComptes = parseInt(v1)||0; const tempsSecondes = parseFloat(v2)||0; const motsParMinute = tempsSecondes ? (motsComptes / tempsSecondes) * 60 : 0; session.session.score = { motsComptes, motsSaisis:motsComptes, tempsSecondes, mpmEvic:motsParMinute, motsParMinute, erreursTexte:0, precisionPct:motsComptes ? 100 : 0, methodeComptage:'Saisie papier : comptage des mots ; fautes et ponctuation non comptabilisées comme erreurs.' }; break; }

          App.render(`<div class="card"><h2>🔀 Suite logique ${isTraining?'(Entraînement)':''}</h2><p>Cliquez sur les ronds en alternant <b>chiffre</b> et <b>lettre</b> dans l'ordre :<br><span style="color:#3b82f6;font-size:1.2rem;">1 → A → 2 → B → 3 → C ...</span></p><canvas id="tmCanvas" width="800" height="400" style="border:1px solid var(--border); width:100%;"></canvas><button class="btn secondary" onclick="showEpreuves()">Menu</button></div>`);
          const canvas=document.getElementById('tmCanvas'); const ctx=canvas.getContext('2d');
          const draw=()=>{ctx.clearRect(0,0,800,400);elements.forEach(el=>{ctx.beginPath();ctx.arc(el.x,el.y,18,0,2*Math.PI);ctx.fillStyle='#f59e0b';ctx.fill();ctx.fillStyle='#000';ctx.font='bold 14px sans-serif';ctx.fillText(el.label,el.x-8,el.y+5);});};
          draw();
          const clickHandler = (e) => {
            const rect=canvas.getBoundingClientRect(); const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
            const x=(e.clientX-rect.left)*scaleX, y=(e.clientY-rect.top)*scaleY;
            const exp=state.expected[state.current]; if(!exp) return;
            let clicked=null;
            for(const el of elements){ if(Math.hypot(x-el.x,y-el.y)<22){ clicked=el; break; } }
            if(!clicked) return;
            if(clicked.type===exp.type && clicked.value===exp.value){
              state.current++; App.beep(500,100);
              if(state.current>=state.expected.length){
                canvas.removeEventListener('click', clickHandler);
                const temps=(Date.now()-state.startTime)/1000;
                epreuve.session.score={temps:temps.toFixed(1),erreurs:state.erreurs};
                App.render(`<div class="card"><h2>Terminé</h2><p>Temps: ${temps.toFixed(1)}s</p></div>`);
                if(!epreuve.isTraining){ epreuve.finish(); askSentiment(epreuve.session); }
                else{ setTimeout(()=>{ alert('Entraînement terminé !'); showEpreuves(); }, 100); }
              } else draw();
            } else { state.erreurs++; App.beep(200,200); }
          };
          canvas.addEventListener('click', clickHandler);
        }
      },
      Memorisation: {
        chooseMode() { chooseMode('Mémorisation visuelle', Epreuves.Memorisation.start); },
        start(mode) {
          if(!App.currentUser) return alert('Profil requis.');
          const isTraining = (mode === 'entrainement');
          const animaux = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮'];
          const selection = animaux.sort(()=>Math.random()-0.5).slice(0,6);
          const allItems = [...selection, ...animaux.filter(i=>!selection.includes(i)).slice(0,6)].sort(()=>Math.random()-0.5);
          const state = { selection, allItems, chosen:[], startTime:null };
          const epreuve = new Epreuve('Mémorisation visuelle', 'numerique', isTraining);
          App.render(`
            <div class="top-nav"><span class="logo">Mémoire ${isTraining?'(Entraînement)':''}</span><button class="btn secondary" onclick="showEpreuves()">Menu</button></div>
            <div class="card center">
              <h2>🧠 Mémorisation visuelle</h2>
              <p>Mémorisez ces 6 animaux (ils disparaîtront après 5 secondes) :</p>
              <div style="font-size:3rem; margin:1rem;">${selection.join(' ')}</div>
              <button class="btn" id="startMemBtn">Démarrer</button>
            </div>
          `);
          document.getElementById('startMemBtn').addEventListener('click', ()=>{
            state.startTime = Date.now();
            App.render(`
              <div class="card center">
                <h2>🧠 Mémorisation visuelle</h2>
                <p>Cliquez sur les animaux que vous avez vus :</p>
                <div id="memChoices" style="display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center; font-size:2.5rem;"></div>
                <button class="btn success" id="validateMem">Valider</button>
              </div>
            `);
            const choicesDiv = document.getElementById('memChoices');
            state.allItems.forEach(item => {
              const div = document.createElement('div');
              div.textContent = item; div.className = 'mem-item';
              div.addEventListener('click', ()=>{
                if(div.classList.contains('selected')) { div.classList.remove('selected'); state.chosen = state.chosen.filter(c=>c!==item); }
                else { div.classList.add('selected'); state.chosen.push(item); }
              });
              choicesDiv.appendChild(div);
            });
            document.getElementById('validateMem').addEventListener('click', ()=>{
              const correct = state.chosen.filter(c=>selection.includes(c)).length;
              const errors = state.chosen.filter(c=>!selection.includes(c)).length;
              epreuve.session.score = { correct, errors, total:6 };
              App.render(`<div class="card"><h2>Résultat</h2><p>Correct: ${correct}/6, Erreurs: ${errors}</p></div>`);
              if(!epreuve.isTraining) { epreuve.finish(); askSentiment(epreuve.session); }
              else { setTimeout(()=>{ alert('Entraînement terminé !'); showEpreuves(); }, 100); }
            });
          });
        }
      }
    };

    function startDragShape(e) {
      e.preventDefault();
      const el = e.target.closest('.shape-on-zone');
      if(!el) return;
      const zone = el.parentElement;
      const rect = zone.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const shiftX = clientX - el.getBoundingClientRect().left;
      const shiftY = clientY - el.getBoundingClientRect().top;
      const move = (ev) => { const cx = ev.touches ? ev.touches[0].clientX : ev.clientX; const cy = ev.touches ? ev.touches[0].clientY : ev.clientY; el.style.left = (cx - rect.left - shiftX) + 'px'; el.style.top = (cy - rect.top - shiftY) + 'px'; };
      const stop = () => { document.removeEventListener('mousemove', move); document.removeEventListener('touchmove', move); document.removeEventListener('mouseup', stop); document.removeEventListener('touchend', stop); };
      document.addEventListener('mousemove', move); document.addEventListener('touchmove', move, {passive:false}); document.addEventListener('mouseup', stop); document.addEventListener('touchend', stop);
    }

    // ========== INITIALISATION ==========

    function startApp() {
      const last = localStorage.getItem('ergoeval_lastUser');
      if(last) {
        const user = App.getUsers().find(u=>u.id===last);
        if(user) { App.currentUser = user; showDashboard(); return; }
      }
      showLogin();
    }

    window.onload = () => {
      App.loadSettings();
      startApp();
    };

    window.startApp = startApp;
    window.showDashboard = showDashboard;
    window.showEpreuves = showEpreuves;
    window.showLogin = showLogin;
    window.selectUser = selectUser;
    window.createUser = createUser;
    window.logout = logout;
    window.openSettings = openSettings;
    window.updateSetting = updateSetting;
    window.showRapport = showRapport;
    window.showInfo = showInfo;
    window.showDataTools = showDataTools;
    window.showObservateurQuestionnaire = showObservateurQuestionnaire;
    window.saveObservateurQuestionnaire = saveObservateurQuestionnaire;
    window.deleteObserverDataForCurrentUser = deleteObserverDataForCurrentUser;
    window.exportCurrentUserCSV = exportCurrentUserCSV;
    window.exportCurrentUserJSON = exportCurrentUserJSON;
    window.exportAllCSV = exportAllCSV;
    window.exportAllJSON = exportAllJSON;
    window.importSessionsJSONFromInput = importSessionsJSONFromInput;
    window.openLocalBackupPicker = openLocalBackupPicker;
    window.showEditSession = showEditSession;
    window.saveSessionEdit = saveSessionEdit;
    window.deleteSessionById = deleteSessionById;
    window.toggleSessionReportInclusion = toggleSessionReportInclusion;
    window.saveReportFilterFromForm = saveReportFilterFromForm;
    window.resetReportFilter = resetReportFilter;
    window.printRapport = printRapport;
    window.saveCurrentReportHTML = saveCurrentReportHTML;
    window.Epreuves = Epreuves;

    window.saveSentiment = saveSentiment;
    window.showPaperInput = showPaperInput;
  </script>
